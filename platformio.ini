; VS Code + PlatformIO ile tek tıkla derle / yükle
; Alt bardan ortamı seç: ws_lcd21 (Waveshare ESP32-S3-Touch-LCD-2.1),
; esp32s3 (genel ESP32-S3 DevKit) veya esp32dev (klasik ESP32)
[platformio]
src_dir = rx8_cluster
default_envs = esp32s3

[env]
platform = espressif32@6.9.0        ; Arduino-ESP32 2.0.17 (test edilen sürüm)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; upload_port = COM5                 ; gerekirse kendi portunu yaz

; YD-ESP32-23 (VCC-GND Studio, ESP32-S3 N16R8): 16MB flash, RGB LED GPIO48
; (kart üstündeki "RGB" köprüsü lehimli değilse LED yanmaz).
; İki USB-C: "COM" (CH343) ve "USB" (dahili); ikisinden de yükleme/log olur.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Touch-LCD-2.1: CAN GPIO20/19'da, ekran kapalı.
; Serial ve yükleme UART (CH343) Type-C portundan; diğer USB-C portunu takma.
[env:ws_lcd21]
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_WS_TOUCH_LCD_21
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32dev]
board = esp32dev
